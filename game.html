<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catch the Flowers!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #2a0a1f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            overflow: hidden;
        }
        #hud {
            margin: 14px;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #score { color: #ffe0f0; }
        #game {
            position: relative;
            width: min(800px, 96vw);
            height: min(520px, 62vh);
            background: linear-gradient(#ff8fc4 0%, #f06aa8 60%, #d6418a 100%);
            border: 4px solid #ff4f9a;
            border-radius: 12px;
            overflow: hidden;
            touch-action: none;          /* let us handle touch ourselves */
        }
        #nika {
            position: absolute;
            top: 6px;
            width: 80px;             /* overridden by JS to scale with width */
            height: auto;
            transition: left 0.05s linear;
        }
        #mari {
            position: absolute;
            bottom: 4px;
            width: 90px;              /* overridden by JS to scale with width */
            height: auto;
        }
        .flower {
            position: absolute;
            font-size: 34px;          /* overridden by JS to scale with width */
            pointer-events: none;
        }
        #hint {
            margin-top: 8px;
            font-size: 14px;
            opacity: 0.6;
            text-align: center;
        }
        /* ---- On-screen touch controls (mobile) ---- */
        #touch-controls {
            display: none;               /* shown only on touch devices */
            gap: 30px;
            margin-top: 14px;
        }
        .touch-btn {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: none;
            background: #d6418a;
            color: #fff;
            font-size: 40px;
            line-height: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-btn:active { background: #ffe0f0; color: #d6418a; }
        body.touch #touch-controls { display: flex; }
        /* ---- Celebration overlay ---- */
        #celebration {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(42, 10, 31, 0.6);
            backdrop-filter: blur(4px);
            z-index: 999;
        }
        #celebration.show { display: flex; }
        #celebration .msg {
            font-size: clamp(40px, 9vw, 96px);
            font-weight: bold;
            color: #fff;
            text-align: center;
            padding: 0 16px;
            text-shadow: 0 0 18px #ff4f9a, 0 0 36px #ff4f9a;
            animation: pop 0.6s ease-out, pulse 1.2s ease-in-out 0.6s infinite;
        }
        @keyframes pop {
            0%   { transform: scale(0) rotate(-12deg); opacity: 0; }
            70%  { transform: scale(1.2) rotate(4deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.08); }
        }
        .confetti {
            position: fixed;
            top: -20px;
            font-size: 28px;
            z-index: 998;
            pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }
    </style>
</head>
<audio controls autoplay loop>
    <source src="assets/subway-surfers.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>
<body>
    <div id="hud">🌸 ყვავილები: <span id="score">0</span></div>
    <div id="game">
        <img id="nika" src="assets/nika.png" alt="nika">
        <img id="mari" src="assets/mari.png" alt="mari">
    </div>

    <div id="celebration"><div class="msg">მარი მიყვარხარ! 💖</div></div>

    <div id="touch-controls">
        <button class="touch-btn" id="btn-left">◀</button>
        <button class="touch-btn" id="btn-right">▶</button>
    </div>

    <script>
    (function () {
        const game   = document.getElementById('game');
        const mari   = document.getElementById('mari');
        const nika  = document.getElementById('nika');
        const scoreEl = document.getElementById('score');

        let W = game.clientWidth;
        let H = game.clientHeight;
        const FLOWER_EMOJIS = ['🌸', '🌹', '🌻', '🌷', '🌺', '💐', '🏵️', '🌼'];

        let score = 0;
        let celebrated = false;
        const keys = { left: false, right: false };

        // ---- Celebration when 10 flowers are caught ----
        function celebrate() {
            const overlay = document.getElementById('celebration');
            overlay.classList.add('show');

            // confetti shower 🎉
            const pieces = ['🌸', '🌹', '🌷', '🌺', '💖', '💐', '✨', '🌼'];
            for (let i = 0; i < 60; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.textContent = pieces[Math.floor(Math.random() * pieces.length)];
                c.style.left = Math.random() * 100 + 'vw';
                c.style.animationDuration = (2 + Math.random() * 2.5) + 's';
                c.style.animationDelay = (Math.random() * 1.5) + 's';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 6000);
            }

            // hide the message after a few seconds so play can continue
            setTimeout(() => overlay.classList.remove('show'), 5000);
        }

        // --- Sizes scale with the game width so it looks right on any screen ---
        let mariW, nikaW, mariSpeed, flowerSize, flowerHalf;
        function computeSizes() {
            W = game.clientWidth;
            H = game.clientHeight;
            mariW      = Math.round(W * 0.115);   // ~92px at 800
            nikaW     = Math.round(W * 0.16);    // ~128px at 800
            flowerSize = Math.round(W * 0.043);   // ~34px at 800
            flowerHalf = flowerSize / 2;
            mariSpeed  = W * 0.009;               // ~7px/frame at 800
            mari.style.width  = mariW  + 'px';
            nika.style.width = nikaW + 'px';
        }
        computeSizes();

        let mariX = (W - mariW) / 2;    // mari left position

        // --- Nika movement (drives back and forth across the top) ---
        let nikaX = 0;
        let nikaDir = 1;
        let nikaSpeed = 2.5;                  // grows over time
        const nikaAccel = 0.0008;             // speed gained per frame
        const nikaMaxSpeed = 20;              // cap so it stays playable

        const flowers = [];

        // ---- Input ----
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft')  { keys.left = true;  e.preventDefault(); }
            if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft')  keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
        });

        // ---- Touch controls ----
        const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        if (isTouch) document.body.classList.add('touch');

        function holdButton(el, side) {
            const press   = (e) => { e.preventDefault(); keys[side] = true; };
            const release = (e) => { e.preventDefault(); keys[side] = false; };
            el.addEventListener('touchstart', press,   { passive: false });
            el.addEventListener('touchend',   release, { passive: false });
            el.addEventListener('touchcancel',release, { passive: false });
            // also work with a mouse for desktop testing
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup',   release);
            el.addEventListener('mouseleave',release);
        }
        holdButton(document.getElementById('btn-left'),  'left');
        holdButton(document.getElementById('btn-right'), 'right');

        // Drag/tap inside the game area to move mari straight to your finger
        let dragging = false;
        function moveToTouch(clientX) {
            const rect = game.getBoundingClientRect();
            const x = clientX - rect.left;
            mariX = Math.max(0, Math.min(W - mariW, x - mariW / 2));
        }
        game.addEventListener('touchstart', (e) => {
            dragging = true; moveToTouch(e.touches[0].clientX); e.preventDefault();
        }, { passive: false });
        game.addEventListener('touchmove', (e) => {
            if (dragging) { moveToTouch(e.touches[0].clientX); e.preventDefault(); }
        }, { passive: false });
        game.addEventListener('touchend',    () => { dragging = false; });
        game.addEventListener('touchcancel', () => { dragging = false; });

        // ---- Keep dimensions in sync on resize / orientation change ----
        window.addEventListener('resize', () => {
            computeSizes();
            mariX = Math.max(0, Math.min(W - mariW, mariX));
        });

        // ---- Spawn flowers from the nika ----
        function spawnFlower() {
            const el = document.createElement('div');
            el.className = 'flower';
            el.textContent = FLOWER_EMOJIS[Math.floor(Math.random() * FLOWER_EMOJIS.length)];
            el.style.fontSize = flowerSize + 'px';
            game.appendChild(el);

            flowers.push({
                el,
                x: nikaX + nikaW / 2 - flowerHalf,    // start at the truck
                y: 70,
                vx: (Math.random() - 0.5) * 4,          // random horizontal drift
                vy: 2 + Math.random() * 5               // random falling speed
            });
        }
        // Spawn rate speeds up over time: the base delay shrinks toward a floor.
        const startTime = performance.now();
        const SPAWN_BASE_START = 1000;   // starting base delay (ms)
        const SPAWN_BASE_MIN   = 150;    // fastest base delay (ms)
        const SPAWN_RAMP_MS    = 90000;  // time to reach the fastest rate (~1.5 min)

        function currentBaseDelay() {
            const t = Math.min(1, (performance.now() - startTime) / SPAWN_RAMP_MS);
            return SPAWN_BASE_START - t * (SPAWN_BASE_START - SPAWN_BASE_MIN);
        }

        // throw a flower; interval gets shorter as the game goes on
        function scheduleSpawn() {
            spawnFlower();
            const base = currentBaseDelay();
            setTimeout(scheduleSpawn, base + Math.random() * base * 0.5);
        }
        scheduleSpawn();

        // ---- Main loop ----
        function loop() {
            // Move mari
            if (keys.left)  mariX -= mariSpeed;
            if (keys.right) mariX += mariSpeed;
            mariX = Math.max(0, Math.min(W - mariW, mariX));
            mari.style.left = mariX + 'px';

            // Move nika (gradually accelerating over time)
            if (nikaSpeed < nikaMaxSpeed) nikaSpeed += nikaAccel;
            nikaX += nikaDir * nikaSpeed;
            if (nikaX <= 0)            { nikaX = 0;            nikaDir = 1; }
            if (nikaX >= W - nikaW)   { nikaX = W - nikaW;   nikaDir = -1; }
            nika.style.left = nikaX + 'px';

            // Move flowers
            const mariTop = H - mariW - 10; // approximate catch line near mari's body
            for (let i = flowers.length - 1; i >= 0; i--) {
                const f = flowers[i];
                f.x += f.vx;
                f.y += f.vy;

                // bounce off side walls
                if (f.x <= 0)               { f.x = 0;               f.vx = Math.abs(f.vx); }
                if (f.x >= W - flowerSize)  { f.x = W - flowerSize;  f.vx = -Math.abs(f.vx); }

                f.el.style.left = f.x + 'px';
                f.el.style.top  = f.y + 'px';

                // Catch check: flower reaches mari's level and overlaps horizontally
                if (f.y >= mariTop) {
                    const fCenter = f.x + flowerHalf;
                    if (fCenter >= mariX && fCenter <= mariX + mariW) {
                        score++;
                        scoreEl.textContent = score;
                        if (score >= 10 && !celebrated) { celebrated = true; celebrate(); }
                        f.el.remove();
                        flowers.splice(i, 1);
                        continue;
                    }
                }

                // Remove flowers that fell off the bottom
                if (f.y > H) {
                    f.el.remove();
                    flowers.splice(i, 1);
                }
            }

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
